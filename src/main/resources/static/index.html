<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rīga Transit Assistant</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #131b2e;
            --panel-2: #1c2740;
            --accent: #eab308;      /* transit yellow - route badges, CTA */
            --accent-2: #0ea5e9;    /* tram blue - user bubbles */
            --text: #e5e9f0;
            --muted: #8b95a7;
            --user: #0ea5e9;
            --assistant: #1c2740;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
        }
        aside {
            width: 280px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #060a14;
        }
        aside header {
            padding: 16px;
            font-weight: 700;
            font-size: 18px;
            border-bottom: 1px solid #060a14;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        aside header .badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            background: var(--accent);
            color: #1a1400;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }
        #new-chat {
            margin: 12px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #1a1400;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        #new-chat:hover { opacity: 0.9; }
        #chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .chat-item:hover { background: var(--panel-2); }
        .chat-item.active { background: var(--panel-2); border-left: 3px solid var(--accent-2); }
        .chat-item .title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .chat-item .count { color: var(--muted); font-size: 12px; }
        .chat-item .del {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
        }
        .chat-item .del:hover { color: #f87171; }
        main { flex: 1; display: flex; flex-direction: column; }
        main header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--panel);
        }
        main header .chat-title {
            font-weight: 600;
            font-size: 16px;
        }
        main header .chat-subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }
        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
        .msg.user { align-self: flex-end; background: var(--user); }
        .msg.assistant { align-self: flex-start; background: var(--assistant); border-left: 3px solid var(--accent); }
        .msg .role {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .empty {
            color: var(--muted);
            margin: auto;
            text-align: center;
            max-width: 420px;
        }
        .empty .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty .empty-title { color: var(--text); font-weight: 600; margin-bottom: 6px; }
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 18px;
        }
        .suggestion-chip {
            background: var(--panel-2);
            border: 1px solid #2a3752;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .suggestion-chip:hover { border-color: var(--accent-2); color: var(--accent-2); }
        form {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid var(--panel);
        }
        #input {
            flex: 1;
            resize: none;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--panel-2);
            background: var(--panel);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        #send {
            padding: 0 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent-2);
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        #send:disabled { opacity: 0.5; cursor: default; }
        #error { color: #f87171; padding: 0 20px 10px; min-height: 18px; font-size: 13px; }
    </style>
</head>
<body>
<aside>
    <header>🚋 Rīga Transit ChatBot <span class="badge">beta</span></header>
    <button id="new-chat">+ New chat</button>
    <div id="chat-list"></div>
</aside>
<main>
    <header>
        <div class="chat-title" id="chat-title">Select or start a chat</div>
        <div class="chat-subtitle">Bus, tram &amp; trolleybus routes across Riga</div>
    </header>
    <div id="chatMessages"><div class="empty">No conversation selected.</div></div>
    <div id="error"></div>
    <form id="composer">
        <textarea id="input" rows="2" placeholder="e.g. How do I get from Āgenskalna tirgus to Ormaņu iela?" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
    </form>
</main>
<script src="/app.js?v=chatMessages"></script>
</body>
</html>
